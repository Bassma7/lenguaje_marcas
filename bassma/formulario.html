<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<fieldset>
    <legend><b>Datos personales</b></legend>
    <label for="nombre"> Nombre:</label>
    <input type="text" id="nombre"/>
    <label for="Edad"> Edad:</label>
    <input type="number" id="apellido"/>
</fieldset>
<fieldset>
    <legend><b>Datos de interés</b></legend>
    <label for="casado"> ¿Estás casado?:</label>
    <label for="Si"> Si</label>
    <input type="radio"  value="Si" required>
    <label for="No"> No</label>
    <input type="radio" value="No" required><br><br>

    <label for="deporte">Deporte:</label> 
    <input type="checkbox" id="Baloncesto" name="deporte" value="Baloncesto"/>
    <label for="Baloncesto">Baloncesto</label>
    <input type="checkbox" id="Fútbol" name="deporte" value="Fútbol"/>
    <label for="Fútbol"> Fútbol</label>
    <input type="checkbox" id="Ciclismo" name="deporte" value="Ciclismo"/>
    <label for="Ciclismo"> Ciclismo</label>
    

</fieldset>
<br> 
<input typo="checkbox" submit="enviar">

</body>
</html>
